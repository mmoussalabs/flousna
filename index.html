<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flousna</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flousna">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="flousna-icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16191d;--mute:#6b7280;--line:#e7e9ee;--good:#1a7f37;--good-bg:#e3f4e8;--bad:#c62828;--bad-bg:#fde7e7;--warn:#a85b00;--warn-bg:#fff1d6;--accent:#e8590c;--accent2:#ff8a3d;--bar:#eceef2;--shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d23;--ink:#eef0f3;--mute:#9aa3ae;--line:#2a2f37;--good:#4cc36b;--good-bg:#173323;--bad:#ff6b6b;--bad-bg:#3a1c1c;--warn:#f0a43a;--warn-bg:#3a2a12;--accent:#ff8a3d;--accent2:#ffb07a;--bar:#2a2f37;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 84px)}
.num{font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:34px;height:34px;border-radius:9px}
.brand h1{font-size:22px;margin:0;letter-spacing:-.01em}.brand .sub{font-size:12px;color:var(--mute)}
.iconbtn{border:0;background:var(--card);color:var(--ink);width:38px;height:38px;border-radius:12px;box-shadow:var(--shadow);font-size:18px;cursor:pointer}
.iconbtn{display:flex;align-items:center;justify-content:center}.iconbtn svg{width:20px;height:20px}.iconbtn.spin svg{animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:22px 4px 8px;font-weight:600}
.card{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px}
.hero{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border-radius:22px;padding:18px 18px 16px;box-shadow:0 6px 18px rgba(232,89,12,.25)}
.hero .l{font-size:13px;opacity:.9}.hero .v{font-size:34px;font-weight:750;letter-spacing:-.02em;margin-top:2px}.hero .u{font-size:14px;font-weight:600;opacity:.85}
.hero .row2{display:flex;gap:16px;margin-top:10px;font-size:13px;opacity:.95;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.tile .l{font-size:12px;color:var(--mute)}.tile .v{font-size:20px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile .s{font-size:12px;color:var(--mute)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mute{color:var(--mute);font-size:13px}.small{font-size:12px}
.bar{position:relative;height:8px;background:var(--bar);border-radius:6px;overflow:visible;margin:8px 0 4px}
.bar>i{display:block;height:100%;border-radius:6px;max-width:100%}
.bar>b{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink);opacity:.35;border-radius:2px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-good{color:var(--good);background:var(--good-bg)}.p-bad{color:var(--bad);background:var(--bad-bg)}.p-warn{color:var(--warn);background:var(--warn-bg)}.p-mute{color:var(--mute);background:var(--bar)}
.c-good{background:var(--good)}.c-bad{background:var(--bad)}.c-warn{background:var(--warn)}.c-acc{background:var(--accent)}.c-mute{background:var(--mute);opacity:.5}
.t-good{color:var(--good)}.t-bad{color:var(--bad)}.t-warn{color:var(--warn)}
.list{background:var(--card);border-radius:18px;padding:2px 16px;box-shadow:var(--shadow)}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}.li .t{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li .s{font-size:12px;color:var(--mute)}
.li>div:first-child{min-width:0;flex:1}.li .a{font-weight:600;text-align:right;white-space:nowrap}
.line{padding:12px 0;border-bottom:1px solid var(--line)}.line:last-child{border-bottom:0}
.line .n{font-weight:600;font-size:14px}.line .r{font-size:12px;color:var(--mute);display:flex;justify-content:space-between}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -16px;padding-left:16px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--card);color:var(--ink);box-shadow:var(--shadow);border-radius:999px;padding:7px 13px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--accent);color:#fff}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
nav button{flex:1;border:0;background:none;color:var(--mute);font-size:11px;font-weight:600;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:24px;height:24px}nav button.on{color:var(--accent)}
.hidden{display:none!important}
#login{max-width:380px;margin:12vh auto 0;text-align:center}
#login img{width:84px;height:84px;border-radius:20px;box-shadow:0 8px 24px rgba(232,89,12,.3)}
#login h1{margin:14px 0 4px;font-size:28px}#login p{color:var(--mute);margin:0 0 22px}
input{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:10px;outline:none}
input:focus{border-color:var(--accent)}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;font-size:16px;color:#fff;background:var(--accent);cursor:pointer}
.btn:disabled{opacity:.6}.link{background:none;border:0;color:var(--accent);font:inherit;font-size:14px;margin-top:12px;cursor:pointer}
.msg{min-height:20px;font-size:14px;margin-top:10px}
.empty{padding:18px 0;text-align:center;color:var(--mute)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px;font-size:13px;color:var(--mute)}.kv b{display:block;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:88vh;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 4px;font-size:18px}.sheet .sub{color:var(--mute);font-size:13px;margin-bottom:14px}
.sheet label{display:block;font-size:12px;color:var(--mute);margin:2px 2px 4px}
select{width:100%;font:inherit;font-size:17px;padding:13px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:10px;-webkit-appearance:none;appearance:none}
.btn.ghost{background:var(--card);color:var(--ink);margin-top:8px;box-shadow:var(--shadow)}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 76px);width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 16px rgba(232,89,12,.4);z-index:20;cursor:pointer}
.tap{cursor:pointer}.tap:active{opacity:.6}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw}
.foot{text-align:center;color:var(--mute);font-size:12px;margin-top:24px}
</style>
</head>
<body>

<section id="login" class="hidden">
  <img src="flousna-icon-512.png" alt="">
  <h1>Flousna</h1>
  <p>Our money, in one place</p>
  <div id="stepEmail">
    <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="Your email" autocapitalize="off">
    <button class="btn" id="sendBtn">Send me a code</button>
  </div>
  <div id="stepCode" class="hidden">
    <p class="mute" id="codeNote" style="margin-bottom:12px"></p>
    <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6 digit code" maxlength="6" style="text-align:center;letter-spacing:.3em">
    <button class="btn" id="verifyBtn">Sign in</button>
    <button class="link" id="backBtn">Use another email</button>
  </div>
  <div class="msg" id="loginMsg"></div>
</section>

<section id="app" class="hidden">
  <header>
    <div class="brand"><img src="flousna-icon-192.png" alt=""><div><h1>Flousna</h1><div class="sub" id="updated">Loading…</div></div></div>
    <button class="iconbtn" id="refreshBtn" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
  </header>
  <main id="view"></main>
  <div class="foot" id="foot"></div>
</section>

<nav id="nav" class="hidden">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-tab="budget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Budget</button>
  <button data-tab="spend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Spending</button>
</nav>

<script>
(function () {
  var API = window.FLOUSNA_API;
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  var state = {data: null, tab: store.get('fl-tab') || 'home', cat: null, email: null};

  function call(body) {
    return fetch(API, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(body), redirect: 'follow'})
      .then(function (r) { return r.json(); });
  }
  var esc = function (x) { return String(x == null ? '' : x).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); };
  var fmt = function (n, dp) { n = +n || 0; return (n < 0 ? '−' : '') + Math.abs(n).toLocaleString('en-US', {minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0}); };
  var d = function (x) { return x ? new Date(x) : null; };
  var day = function (x) { x = d(x); return x ? x.toLocaleDateString('en-GB', {day: 'numeric', month: 'short'}) : ''; };
  var monthName = function (x) { x = d(x); return x ? x.toLocaleDateString('en-GB', {month: 'long', year: 'numeric'}) : ''; };
  var pillFor = function (s) {
    var k = /over/i.test(s) ? 'p-bad' : /watch|not yet/i.test(s) ? 'p-warn' : /on track|paid/i.test(s) ? 'p-good' : 'p-mute';
    return s ? '<span class="pill ' + k + '">' + esc(s) + '</span>' : '';
  };
  var colorFor = function (s) { return /over/i.test(s) ? 'c-bad' : /watch/i.test(s) ? 'c-warn' : /no target/i.test(s) ? 'c-mute' : 'c-good'; };
  var CAT_COLORS = ['#e8590c', '#3b5bdb', '#2b8a3e', '#c2255c', '#7048e8', '#1098ad', '#e67700', '#5c940d', '#ae3ec9', '#0b7285', '#d6336c', '#495057'];

  // ------------------------------------------------------------ sign in
  function showLogin(msg) {
    $('app').classList.add('hidden'); $('nav').classList.add('hidden'); $('login').classList.remove('hidden');
    $('loginMsg').textContent = msg || '';
    var em = store.get('fl-email'); if (em) $('email').value = em;
  }
  $('sendBtn').onclick = function () {
    var em = $('email').value.trim().toLowerCase();
    if (!/^\S+@\S+\.\S+$/.test(em)) { $('loginMsg').textContent = 'Type your email first.'; return; }
    $('sendBtn').disabled = true; $('loginMsg').textContent = 'Sending…';
    call({flousna: 'code', email: em}).then(function (r) {
      $('sendBtn').disabled = false;
      if (!r.ok) { $('loginMsg').textContent = r.error || 'Could not send the code.'; return; }
      store.set('fl-email', em); state.email = em;
      $('stepEmail').classList.add('hidden'); $('stepCode').classList.remove('hidden');
      $('codeNote').textContent = 'If ' + em + ' is on the list, a code is on its way. Check your inbox.';
      $('loginMsg').textContent = ''; $('code').focus();
    }).catch(function () { $('sendBtn').disabled = false; $('loginMsg').textContent = 'No connection. Try again.'; });
  };
  $('verifyBtn').onclick = function () {
    $('verifyBtn').disabled = true; $('loginMsg').textContent = 'Checking…';
    call({flousna: 'verify', email: state.email || $('email').value.trim().toLowerCase(), code: $('code').value}).then(function (r) {
      $('verifyBtn').disabled = false;
      if (!r.ok) { $('loginMsg').textContent = r.error || 'That did not work.'; return; }
      store.set('fl-session', r.session); $('code').value = ''; load();
    }).catch(function () { $('verifyBtn').disabled = false; $('loginMsg').textContent = 'No connection. Try again.'; });
  };
  $('code').addEventListener('input', function () { if ($('code').value.replace(/\D/g, '').length === 6) $('verifyBtn').click(); });
  $('backBtn').onclick = function () { $('stepCode').classList.add('hidden'); $('stepEmail').classList.remove('hidden'); $('loginMsg').textContent = ''; };

  // ------------------------------------------------------------ edit sheets
  function toast(t) { var el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(function () { el.remove(); }, 2600); }
  function closeSheet() { var b = document.querySelector('.sheetbg'); if (b) b.remove(); }
  function openSheet(title, sub, fields, btn, send) {
    closeSheet();
    var bg = document.createElement('div'); bg.className = 'sheetbg';
    bg.innerHTML = '<div class="sheet"><div class="grab"></div><h3>' + esc(title) + '</h3><div class="sub">' + sub + '</div>' + fields +
      '<button class="btn" id="sheetOk">' + esc(btn) + '</button><button class="btn ghost" id="sheetNo">Cancel</button><div class="msg" id="sheetMsg"></div></div>';
    document.body.appendChild(bg);
    bg.onclick = function (e) { if (e.target === bg) closeSheet(); };
    $('sheetNo').onclick = closeSheet;
    $('sheetOk').onclick = function () {
      var body;
      try { body = send(); } catch (err) { $('sheetMsg').textContent = err.message; return; }
      body.session = store.get('fl-session');
      $('sheetOk').disabled = true; $('sheetMsg').textContent = 'Saving…';
      call(body).then(function (r) {
        $('sheetOk').disabled = false;
        if (r.auth === false) { closeSheet(); store.del('fl-session'); showLogin('Please sign in again.'); return; }
        if (!r.ok) { $('sheetMsg').textContent = r.error || 'Could not save.'; return; }
        closeSheet(); state.data = r.data; render(); toast(r.message || 'Saved');
      }).catch(function () { $('sheetOk').disabled = false; $('sheetMsg').textContent = 'No connection. Try again.'; });
    };
    var first = bg.querySelector('input,select'); if (first && first.type !== 'date') setTimeout(function () { first.focus(); }, 200);
  }
  function catSelect(id, selected) {
    var list = (state.data.categoryList || []), h = ['<select id="' + id + '">'];
    if (!selected) h.push('<option value="">Pick a category</option>');
    var groups = {};
    list.forEach(function (c) { (groups[c.line] = groups[c.line] || []).push(c.name); });
    Object.keys(groups).forEach(function (g) {
      h.push('<optgroup label="' + esc(g) + '">');
      groups[g].forEach(function (n) { h.push('<option' + (n === selected ? ' selected' : '') + '>' + esc(n) + '</option>'); });
      h.push('</optgroup>');
    });
    return h.join('') + '</select>';
  }
  var todayIso = function () { var t = new Date(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); };
  var needAmount = function (id) { var v = parseFloat(String($(id).value).replace(/,/g, '')); if (!(v > 0)) throw new Error('Type the amount'); return v; };

  function editCategory(r) {
    openSheet('Change category', esc(r.desc) + '<br>' + fmt(r.aed, 2) + ' AED · ' + esc(day(r.date)) + ' · ' + esc(r.paidWith),
      '<label>Category</label>' + catSelect('fCat', r.cat), 'Save', function () {
        return {flousna: 'setCategory', date: r.date, desc: r.desc, aed: r.aed, paidWith: r.paidWith, category: $('fCat').value};
      });
  }
  function addCash() {
    openSheet('Add cash expense', 'For anything you paid in cash.',
      '<label>Amount (AED)</label><input id="fAmt" type="text" inputmode="decimal" placeholder="0.00">' +
      '<label>What for</label><input id="fDesc" type="text" placeholder="e.g. Car wash" maxlength="80">' +
      '<label>Category</label>' + catSelect('fCat') + '<label>Date</label><input id="fDate" type="date" value="' + todayIso() + '">', 'Add', function () {
        var a = needAmount('fAmt');
        if (!$('fDesc').value.trim()) throw new Error('Type what it was for');
        if (!$('fCat').value) throw new Error('Pick a category');
        return {flousna: 'addCash', amount: a, desc: $('fDesc').value, category: $('fCat').value, date: $('fDate').value};
      });
  }
  function markPaid(f) {
    openSheet('Mark as paid', esc(f.name) + ' · budget ' + fmt(f.budget) + ' AED<br>Use this when the bank sent no message for it.',
      '<label>Amount paid (AED)</label><input id="fAmt" type="text" inputmode="decimal" value="' + (f.budget || '') + '">' +
      '<label>Date</label><input id="fDate" type="date" value="' + todayIso() + '">', 'Mark paid', function () {
        return {flousna: 'markPaid', name: f.name, amount: needAmount('fAmt'), date: $('fDate').value};
      });
  }
  function setBalance(a) {
    openSheet('Update balance', esc(a.name) + ' · ' + esc(a.bank) + '<br>Now ' + fmt(a.bal, 2) + ' ' + esc(a.cur),
      '<label>New balance (' + esc(a.cur) + ')</label><input id="fBal" type="text" inputmode="decimal" value="' + a.bal + '">', 'Save', function () {
        var v = parseFloat(String($('fBal').value).replace(/,/g, ''));
        if (isNaN(v)) throw new Error('Type the balance');
        return {flousna: 'setBalance', last4: a.last4, name: a.name, cur: a.cur, balance: v};
      });
  }

  // ------------------------------------------------------------ data
  function load() {
    var s = store.get('fl-session');
    if (!s) { showLogin(); return; }
    $('login').classList.add('hidden'); $('app').classList.remove('hidden'); $('nav').classList.remove('hidden');
    $('refreshBtn').classList.add('spin');
    call({flousna: 'data', session: s}).then(function (r) {
      $('refreshBtn').classList.remove('spin');
      if (r.auth === false) { store.del('fl-session'); showLogin('Please sign in again.'); return; }
      if (!r.ok) { $('updated').textContent = r.error || 'Could not load'; return; }
      state.data = r.data; state.email = r.email; render();
    }).catch(function () { $('refreshBtn').classList.remove('spin'); $('updated').textContent = 'Offline. Tap refresh to retry.'; });
  }
  $('refreshBtn').onclick = load;
  document.addEventListener('visibilitychange', function () { if (!document.hidden && state.data && Date.now() - state.loadedAt > 60000) load(); });
  Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) {
    b.onclick = function () { state.tab = b.dataset.tab; store.set('fl-tab', state.tab); render(); window.scrollTo(0, 0); };
  });

  function render() {
    state.view = {sp: [], ac: []};
    state.loadedAt = Date.now();
    var D = state.data;
    $('updated').textContent = 'Updated ' + new Date(D.holdings.now).toLocaleString('en-GB', {day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit'});
    Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) { b.classList.toggle('on', b.dataset.tab === state.tab); });
    $('view').innerHTML = state.tab === 'budget' ? budgetView(D) : state.tab === 'spend' ? spendView(D) : homeView(D);
    $('foot').innerHTML = 'Signed in as ' + esc(state.email) + ' · <button class="link" id="logout" style="margin:0;font-size:12px">Sign out</button>';
    $('logout').onclick = function () { call({flousna: 'logout', session: store.get('fl-session')}).catch(function () {}); store.del('fl-session'); showLogin(); };
    Array.prototype.forEach.call(document.querySelectorAll('[data-cat]'), function (c) {
      c.onclick = function () { state.cat = c.dataset.cat || null; render(); };
    });
    var fab = document.querySelector('.fab'); if (fab) fab.remove();
    if (state.tab === 'spend') { fab = document.createElement('button'); fab.className = 'fab'; fab.textContent = '+'; fab.setAttribute('aria-label', 'Add cash expense'); fab.onclick = addCash; document.body.appendChild(fab); }
    Array.prototype.forEach.call(document.querySelectorAll('[data-sp]'), function (el) { el.onclick = function () { editCategory(state.view.sp[+el.dataset.sp]); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-fx]'), function (el) { el.onclick = function () { markPaid(state.data.budget.fixed[+el.dataset.fx]); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-ac]'), function (el) { el.onclick = function () { setBalance(state.view.ac[+el.dataset.ac]); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-go]'), function (c) {
      c.onclick = function () { state.tab = c.dataset.go; store.set('fl-tab', state.tab); render(); window.scrollTo(0, 0); };
    });
  }

  // ------------------------------------------------------------ home
  function homeView(D) {
    var H = D.holdings, h = [], today = new Date();
    var cash = {}, cashAed = 0, owed = 0, dueNow = 0;
    H.accts.forEach(function (a) { cash[a.cur] = (cash[a.cur] || 0) + a.bal; cashAed += a.aed; });
    H.cards.forEach(function (c) { owed += c.owed; dueNow += c.stillDue; });
    var G = H.gold, M = H.mort, usd = (H.fx && H.fx.USD) || 3.6725, OZ = 31.1034768;
    var mortAed = M && M.leftAed != null ? M.leftAed : 0, homeAed = M ? M.homeAed : 0;
    var worth = cashAed + G.value + homeAed - owed - mortAed;
    h.push('<div class="tile"><div class="l">Net worth (cash + gold + home − cards − mortgage)</div><div class="v num ' + (worth < 0 ? 't-bad' : 't-good') + '" style="font-size:30px">' + fmt(worth) + ' <span class="s" style="font-size:13px">AED</span></div></div>',
      '<div class="grid" style="margin-top:10px">',
      tile('Cash in accounts', fmt(cashAed) + ' <span class="s">AED</span>'), tile('Gold value', fmt(G.value) + ' <span class="s">AED</span>'),
      tile('Owed on cards', fmt(owed) + ' <span class="s">AED</span>'), tile('Mortgage left', fmt(mortAed) + ' <span class="s">AED</span>'), '</div>',
      '<div class="tile" style="margin-top:10px"><div class="l">Due now on card statements</div><div class="v num ' + (dueNow > 0 ? 't-bad' : 't-good') + '">' + (dueNow > 0 ? fmt(dueNow, 2) + ' <span class="s">AED</span>' : 'Nothing due') + '</div></div>');

    h.push('<h2>Cash by currency</h2><div class="grid">');
    Object.keys(cash).sort(function (a, b) { var o = ['AED', 'EGP', 'USD']; return (o.indexOf(a) + 9) % 12 - (o.indexOf(b) + 9) % 12 || (a < b ? -1 : 1); }).forEach(function (c) {
      h.push(tile(c, fmt(cash[c]), c === 'AED' ? '' : '≈ ' + fmt(cash[c] * (H.fx[c] || 0)) + ' AED'));
    });
    h.push('</div>');

    if (G.bars || G.grams) {
      var pl = G.value - G.cost, pct = G.cost ? pl / G.cost : 0, be = G.grams ? G.cost / G.grams * OZ : 0;
      h.push('<h2>Gold</h2><div class="card"><div class="row"><div><div class="n" style="font-size:17px;font-weight:700">' + fmt(G.grams, 1) + ' g</div><div class="s mute">' + (G.bars || '') + ' bars · 24K</div></div>',
        '<div style="text-align:right"><div class="num" style="font-size:22px;font-weight:700">' + fmt(G.value) + '</div><div class="mute">AED today</div></div></div>',
        '<div class="kv"><div>Paid<b>' + fmt(G.cost) + ' AED</b></div>',
        '<div>Profit / loss<b class="' + (pl < 0 ? 't-bad' : 't-good') + '">' + (pl >= 0 ? '+' : '') + fmt(pl) + ' (' + (pct >= 0 ? '+' : '') + (pct * 100).toFixed(1) + '%)</b></div>',
        '<div>Price per gram<b>' + fmt(G.price, 2) + ' AED</b></div>',
        '<div>Break-even per oz<b>' + fmt(be) + ' AED · $' + fmt(be / usd) + '</b></div>',
        '<div>Today per oz<b>' + fmt(G.price * OZ) + ' AED · $' + fmt(G.price * OZ / usd) + '</b></div>',
        '<div>Price updated<b>' + (G.updated ? esc(new Date(G.updated).toLocaleString('en-GB', {day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit'})) : '-') + '</b></div></div></div>');
    }
    if (M) {
      var paid = Math.max(0, Math.min(1, M.paidPct || 0));
      h.push('<h2>Mortgage</h2><div class="card"><div class="row"><div><div style="font-size:17px;font-weight:700">' + esc(M.bank || 'Mortgage') + '</div><div class="s mute">Loan ' + fmt(M.loan) + ' ' + esc(M.cur) + '</div></div>',
        '<div style="text-align:right"><div class="num" style="font-size:22px;font-weight:700">' + fmt(M.left || 0) + '</div><div class="mute">' + esc(M.cur) + ' left</div></div></div>',
        '<div class="bar"><i class="c-good" style="width:' + Math.round(paid * 100) + '%"></i></div>',
        '<div class="row mute small"><span>' + Math.round(paid * 100) + '% paid off</span><span>' + (M.monthsLeft != null ? fmt(M.monthsLeft) + ' instalments left' : '') + '</span></div>',
        '<div class="kv"><div>Monthly instalment<b>' + (M.instalment != null ? fmt(M.instalment, 2) : '-') + '</b></div>',
        '<div>Last instalment<b>' + (M.end ? esc(new Date(M.end).toLocaleDateString('en-GB', {month: 'short', year: 'numeric'})) : '-') + '</b></div>',
        '<div>Interest still to pay<b>' + (M.interestLeft != null ? fmt(M.interestLeft) : '-') + '</b></div>',
        '<div>Home equity<b>' + (M.equity != null ? fmt(M.equity) + ' AED' : '-') + '</b></div></div></div>');
    }

    h.push('<h2>Credit cards</h2>');
    H.cards.forEach(function (c) {
      var used = c.limit ? Math.min(1, Math.max(0, c.owed / c.limit)) : 0;
      var prog = c.target ? Math.min(1, c.spent / c.target) : 0;
      var due = d(c.due), dueSoon = c.stillDue > 0 && due && (due - today) / 864e5 <= 5;
      var met = c.target && c.spent >= c.target, fx = c.cur && c.cur !== 'AED' && H.fx[c.cur];
      h.push('<div class="card"><div class="row"><div><div style="font-size:17px;font-weight:700">' + esc(c.id) + '</div><div class="s mute">' + esc(c.bank) + '</div></div>',
        '<div style="text-align:right"><div class="num" style="font-size:22px;font-weight:700">' + fmt(c.owed) + '</div><div class="mute">' +
          (fx ? fmt(c.owed / fx) + ' ' + esc(c.cur) + ' of ' + fmt(c.limit / fx) : 'owed of ' + fmt(c.limit)) + '</div></div></div>',
        '<div class="bar"><i class="' + (used > .7 ? 'c-bad' : 'c-acc') + '" style="width:' + Math.round(used * 100) + '%"></i></div>',
        '<div class="row mute small"><span>Available ' + fmt(c.avail) + '</span><span>' + Math.round(used * 100) + '% used</span></div>',
        '<div class="kv"><div>Still due<b class="' + (c.stillDue > 0 ? (dueSoon ? 't-bad' : 't-warn') : 't-good') + '">' + (c.stillDue > 0 ? fmt(c.stillDue, 2) + ' by ' + esc(day(c.due)) : 'Nothing due') + '</b></div>',
        '<div>Cycle ends<b>' + esc(day(c.cycleEnd)) + (c.daysLeft !== '' && c.daysLeft != null ? ' · ' + esc(c.daysLeft) + ' days' : '') + '</b></div></div>');
      if (c.target) {
        h.push('<div style="margin-top:12px" class="row"><span class="mute">Spend target</span>' + pillFor(c.status) + '</div>',
          '<div class="bar"><i class="' + (met ? 'c-good' : 'c-warn') + '" style="width:' + Math.round(prog * 100) + '%"></i></div>',
          '<div class="row mute small"><span>' + fmt(c.spent) + ' of ' + fmt(c.target) + '</span><span>' + (met ? 'Done' : fmt(c.target - c.spent) + ' to go · ' + fmt(c.perDay) + '/day') + '</span></div>');
      }
      h.push('</div>');
    });

    h.push('<h2>Bank accounts</h2><div class="list">');
    if (!H.accts.length) h.push('<div class="empty">No accounts yet.</div>');
    H.accts.slice().sort(function (x, y) { var o = ['AED', 'EGP', 'USD']; return o.indexOf(x.cur) - o.indexOf(y.cur) || y.aed - x.aed; }).forEach(function (a) {
      state.view.ac.push(a);
      h.push('<div class="li tap" data-ac="' + (state.view.ac.length - 1) + '"><div><div class="t">' + esc(a.name) + '</div><div class="s">' + esc(a.bank) + (/\d/.test(a.last4) ? ' ··' + esc(String(a.last4).slice(-4)) : '') + (a.asOf ? ' · ' + esc(day(a.asOf)) : '') + '</div></div>',
        '<div class="a num">' + fmt(a.bal, 2) + ' ' + esc(a.cur) + (a.cur !== 'AED' ? '<div class="s">≈ ' + fmt(a.aed) + ' AED</div>' : '') + '</div></div>');
    });
    h.push('</div><div class="mute small" style="margin:8px 4px 0">Tap an account to update its balance.</div>');
    return h.join('');
  }
  function tile(l, v, s) { return '<div class="tile"><div class="l">' + esc(l) + '</div><div class="v num">' + v + '</div><div class="s">' + (s || '') + '</div></div>'; }

  // ------------------------------------------------------------ budget
  function budgetView(D) {
    var B = D.budget, h = [];
    if (!B) return '<div class="empty">No Budget tab yet.</div>';
    var T = B.total;
    h.push('<div class="card"><div class="mute">' + esc(monthName(B.month)) + '</div>',
      '<div class="row" style="margin-top:2px"><div><span class="num" style="font-size:28px;font-weight:750">' + fmt(T.spent) + '</span> <span class="mute">of ' + fmt(T.target) + '</span></div>' + pillFor(T.status) + '</div>',
      '<div class="bar"><i class="' + colorFor(T.status) + '" style="width:' + Math.min(100, T.target ? T.spent / T.target * 100 : 0).toFixed(1) + '%"></i><b style="left:' + (B.pace * 100).toFixed(1) + '%"></b></div>',
      '<div class="row mute small"><span>' + (T.left >= 0 ? fmt(T.left) + ' left' : '<span class="t-bad">' + fmt(-T.left) + ' over</span>') + '</span><span>Line = today</span></div></div>');
    h.push('<h2>By budget line</h2><div class="list">');
    B.lines.filter(function (l) { return l.target || l.spent; }).forEach(function (l) {
      var q = /quarter/i.test(l.type), tgt = q ? l.target * 3 : l.target, used = q ? tgt - l.left : l.spent;
      var w = tgt ? Math.min(100, used / tgt * 100) : (used ? 100 : 0);
      h.push('<div class="line"><div class="row"><span class="n">' + esc(l.name) + '</span>' + pillFor(l.status) + '</div>',
        '<div class="bar"><i class="' + colorFor(l.status) + '" style="width:' + w.toFixed(1) + '%"></i>' + (/variable/i.test(l.type) && tgt ? '<b style="left:' + (B.pace * 100).toFixed(1) + '%"></b>' : '') + '</div>',
        '<div class="r"><span class="num">' + fmt(l.spent) + ' of ' + fmt(l.target) + (q ? ' · last 3 months ' + fmt(used) + ' of ' + fmt(tgt) : '') + '</span><span class="num">' + (l.left >= 0 ? fmt(l.left) + ' left' : '<span class="t-bad">' + fmt(-l.left) + ' over</span>') + '</span></div></div>');
    });
    h.push('</div><h2>Fixed payments</h2><div class="list">');
    B.fixed.forEach(function (f, i) {
      if (!(f.budget || f.paid)) return;
      var can = !/auto/i.test(f.how);
      h.push('<div class="li' + (can ? ' tap" data-fx="' + i : '') + '"><div><div class="t">' + esc(f.name) + '</div><div class="s">' + esc(f.paidBy) + ' · ' + esc(f.how) + '</div></div>',
        '<div class="a"><div class="num">' + fmt(f.paid || f.budget) + '</div>' + pillFor(f.status) + '</div></div>');
    });
    h.push('</div><div class="mute small" style="margin:8px 4px 0">Tap a payment the bank did not tell us about to mark it paid.</div>');
    return h.join('');
  }

  // ------------------------------------------------------------ spending
  function spendView(D) {
    var h = [], cats = D.categories || [], rows = D.spending || [];
    var total = cats.reduce(function (s, c) { return s + Math.max(0, c.spent); }, 0);
    var colors = {};
    cats.forEach(function (c, i) { colors[c.name] = CAT_COLORS[i % CAT_COLORS.length]; });
    h.push('<div class="card"><div class="mute">' + esc(monthName(D.budget && D.budget.month)) + ' by category</div>');
    h.push('<div style="display:flex;height:12px;border-radius:7px;overflow:hidden;margin:10px 0 12px;background:var(--bar)">');
    cats.forEach(function (c) { if (c.spent > 0) h.push('<span style="width:' + (c.spent / total * 100).toFixed(2) + '%;background:' + colors[c.name] + '"></span>'); });
    h.push('</div>');
    cats.forEach(function (c) {
      h.push('<div class="row" style="padding:5px 0;cursor:pointer" data-cat="' + esc(c.name) + '"><span><span class="dot" style="background:' + colors[c.name] + '"></span>' + esc(c.name) + ' <span class="mute small">' + c.count + '</span></span><span class="num" style="font-weight:600">' + fmt(c.spent) + '</span></div>');
    });
    h.push('</div><div class="chips"><button class="chip' + (state.cat ? '' : ' on') + '" data-cat="">All</button>');
    cats.forEach(function (c) { h.push('<button class="chip' + (state.cat === c.name ? ' on' : '') + '" data-cat="' + esc(c.name) + '">' + esc(c.name) + '</button>'); });
    h.push('</div>');
    var list = rows.filter(function (r) { return !state.cat || r.cat === state.cat; });
    h.push('<div class="list">');
    if (!list.length) h.push('<div class="empty">Nothing here this month.</div>');
    list.forEach(function (r) {
      var can = r.paidWith !== 'Cash (auto)';
      if (can) state.view.sp.push(r);
      h.push('<div class="li' + (can ? ' tap" data-sp="' + (state.view.sp.length - 1) : '') + '"><div><div class="t">' + esc(r.desc) + '</div><div class="s"><span class="dot" style="background:' + (colors[r.cat] || '#999') + '"></span>' + esc(r.cat) + ' · ' + esc(day(r.date)) + ' · ' + esc(r.paidWith) + (r.who && r.who !== 'MO' && r.who !== 'Family' ? ' · ' + esc(r.who) : '') + '</div></div>',
        '<div class="a num ' + (r.aed < 0 ? 't-good' : '') + '">' + fmt(r.aed, 2) + '</div></div>');
    });
    h.push('</div><div class="mute small" style="margin:8px 4px 0">Tap a payment to change its category. Tap + to add a cash expense.</div>');
    return h.join('');
  }

  if (!API) { showLogin('Setup needed: the API address is missing in config.js.'); return; }
  load();
})();
</script>
</body>
</html>
