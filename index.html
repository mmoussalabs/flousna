<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flousna</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flousna">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="flousna-icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js"></script>
<style>
:root{
  --bg:#f5f4f1;--card:#ffffff;--card2:#faf9f7;--ink:#121417;--ink2:#3a3f47;--mute:#7a7f87;--line:#ebe8e3;
  --accent:#e8590c;--accent2:#ff8a3d;--accent-soft:#fff0e6;
  --good:#11845b;--good-soft:#e2f5ec;--bad:#d1453b;--bad-soft:#fdeceb;--warn:#c27400;--warn-soft:#fff3dc;
  --track:#efede9;--shadow:0 1px 1px rgba(18,20,23,.03),0 4px 14px rgba(18,20,23,.05);
  --r:20px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d0f12;--card:#171a1f;--card2:#1c2026;--ink:#f2f3f5;--ink2:#c9cdd3;--mute:#8d949e;--line:#262a31;
  --accent:#ff8a3d;--accent2:#ffb07a;--accent-soft:#2c1c12;
  --good:#3ccf91;--good-soft:#11291f;--bad:#ff6b61;--bad-soft:#341716;--warn:#f2a93b;--warn-soft:#33260f;
  --track:#252a31;--shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:calc(env(safe-area-inset-top) + 6px) 16px calc(env(safe-area-inset-bottom) + 104px)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.cur{font-size:.55em;font-weight:600;color:var(--mute);margin-left:3px;letter-spacing:.02em}
.up{color:var(--good)}.down{color:var(--bad)}.warnc{color:var(--warn)}.mute{color:var(--mute)}.small{font-size:12.5px}
.hidden{display:none!important}

/* loading bar */
#loadbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:80;overflow:hidden;opacity:0;transition:opacity .2s}
#loadbar.on{opacity:1}
#loadbar i{position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{left:-40%}to{left:100%}}

/* header */
header{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 16px}
.hello .t{font-size:13px;color:var(--mute)}.hello h1{font-size:26px;margin:0;letter-spacing:-.02em;font-weight:750}
.hbtns{display:flex;gap:8px}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:transform .15s}
.round:active{transform:scale(.92)}.round svg{width:19px;height:19px}
.round.busy{color:var(--accent);border-color:var(--accent)}
.avatar{font-weight:700;font-size:15px;color:var(--accent);background:var(--accent-soft);border-color:transparent}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 20px 18px;color:#fff;background:linear-gradient(150deg,#22262e 0%,#16181d 55%,#1d140f 100%);box-shadow:0 10px 30px rgba(10,12,16,.18)}
.hero:before{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,138,61,.45),rgba(255,138,61,0) 70%)}
.hero .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.65}
.hero .big{font-size:38px;font-weight:780;letter-spacing:-.03em;margin:4px 0 2px;position:relative}
.hero .big .cur{color:rgba(255,255,255,.55)}
.split{display:flex;height:8px;border-radius:6px;overflow:hidden;margin:16px 0 12px;background:rgba(255,255,255,.08);gap:3px}
.split span{display:block;border-radius:6px}
.legend2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.legend2 .k{font-size:12px;opacity:.65;display:flex;align-items:center;gap:6px}.legend2 .v{font-size:17px;font-weight:700;margin-top:2px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.hero .up{color:#5fe0a6}.hero .down{color:#ff8a80}

/* sections and cards */
h2{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:26px 4px 10px;font-weight:650}
h2 small{text-transform:none;letter-spacing:0;font-weight:500;font-size:12px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.alert{display:flex;gap:12px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:16px;padding:12px 14px;margin-top:12px;font-size:14px;font-weight:550}
.alert svg{width:20px;height:20px;flex:none}
.alert.badc{background:var(--bad-soft);color:var(--bad)}

/* rows with icons */
.rows{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);padding:4px 0}
.ri{display:flex;align-items:center;gap:12px;padding:11px 16px;position:relative}
.ri+.ri:before{content:"";position:absolute;top:0;left:64px;right:0;border-top:1px solid var(--line)}
.ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:20px;height:20px}
.ic.g{background:var(--good-soft);color:var(--good)}.ic.r{background:var(--bad-soft);color:var(--bad)}.ic.o{background:var(--accent-soft);color:var(--accent)}.ic.n{background:var(--track);color:var(--ink2)}
.ri .m{flex:1;min-width:0}.ri .t{font-size:15px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ri .s{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri .a{text-align:right;font-weight:650;white-space:nowrap}.ri .a .s{font-weight:500}
.tap{cursor:pointer}.tap:active{background:var(--card2)}
.chev{color:var(--line);margin-left:-4px}

/* chips & pills */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.up{background:var(--good-soft)}.chip.down{background:var(--bad-soft)}.chip.warnc{background:var(--warn-soft)}.chip.n{background:var(--track);color:var(--mute)}
.hero .chip.up{background:rgba(95,224,166,.14)}.hero .chip.down{background:rgba(255,138,128,.14)}

/* stats grid */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:14px}
.stats b.up{color:var(--good)}.stats b.down{color:var(--bad)}
.stats div{font-size:12px;color:var(--mute)}.stats b{display:block;font-size:15px;color:var(--ink);font-weight:650;margin-top:1px;font-variant-numeric:tabular-nums}

/* bars */
.bar{position:relative;height:7px;background:var(--track);border-radius:6px;margin:10px 0 6px}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;max-width:100%}
.bar>b{position:absolute;top:-4px;width:2px;height:15px;background:var(--ink);opacity:.35;border-radius:2px}
.f-good{background:var(--good)}.f-bad{background:var(--bad)}.f-warn{background:var(--warn)}.f-acc{background:linear-gradient(90deg,var(--accent2),var(--accent))}.f-mute{background:var(--mute);opacity:.4}
.stack{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;margin:4px 0 14px}
.stack span{display:block}

/* big value lines */
.kv1{font-size:12.5px;color:var(--mute)}.v1{font-size:24px;font-weight:750;letter-spacing:-.02em}

/* card tiles (credit cards) */
.cc{background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow);padding:16px;margin-bottom:10px}
.cc .top{display:flex;justify-content:space-between;align-items:flex-start}
.cc .nm{font-weight:700;font-size:16px}.cc .bk{font-size:12.5px;color:var(--mute)}
.cc .owed{font-size:22px;font-weight:750;text-align:right}

/* budget ring */
.ringwrap{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:132px;height:132px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:26px;font-weight:780;letter-spacing:-.02em}.ring .c span{font-size:11.5px;color:var(--mute)}
.ringinfo .v1{font-size:26px}
.sumchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

.line{padding:13px 16px;position:relative}
.line+.line:before{content:"";position:absolute;top:0;left:16px;right:16px;border-top:1px solid var(--line)}
.line .n{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px}
.line .r{font-size:12.5px;color:var(--mute);display:flex;justify-content:space-between;gap:8px}

.check{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;border:2px solid var(--line)}
.check.on{background:var(--good);border-color:var(--good);color:#fff}.check svg{width:14px;height:14px}

/* spending */
.donutwrap{display:flex;align-items:center;gap:16px}
.donut{position:relative;width:150px;height:150px;flex:none}
.donut svg{width:150px;height:150px;transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .c b{font-size:20px;font-weight:780}.donut .c span{font-size:11.5px;color:var(--mute)}
.leg{flex:1;min-width:0;font-size:13px}
.leg div{display:flex;align-items:center;gap:7px;padding:3px 0;cursor:pointer}
.leg .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.leg .pc{color:var(--mute);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 6px;padding:2px 16px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:550;white-space:nowrap;cursor:pointer}
.fchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dayh{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute);font-weight:600;margin:16px 4px 6px}

/* nav */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(360px,calc(100% - 32px));background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);border-radius:22px;display:flex;padding:6px;box-shadow:0 8px 28px rgba(0,0,0,.12);z-index:30}
nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:11px;font-weight:650;padding:7px 0 5px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--accent);background:var(--accent-soft)}
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 86px);width:54px;height:54px;border-radius:18px;border:0;background:linear-gradient(145deg,var(--accent2),var(--accent));color:#fff;box-shadow:0 8px 20px rgba(232,89,12,.35);z-index:25;cursor:pointer;display:flex;align-items:center;justify-content:center}
.fab svg{width:26px;height:26px}

/* sheets, toasts, login */
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:88vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font-size:19px}.sheet .sub{color:var(--mute);font-size:13px;margin-bottom:16px}
label{display:block;font-size:12px;color:var(--mute);margin:2px 2px 5px;font-weight:600}
input,select{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:12px;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus{border-color:var(--accent)}
.btn{width:100%;border:0;border-radius:15px;padding:15px;font:inherit;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(145deg,var(--accent2),var(--accent));cursor:pointer}
.btn:disabled{opacity:.6}.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);margin-top:8px}
.link{background:none;border:0;color:var(--accent);font:inherit;font-size:14px;margin-top:12px;cursor:pointer}
.msg{min-height:20px;font-size:14px;margin-top:10px;color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 12px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:550;z-index:60;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#login{max-width:380px;margin:12vh auto 0;text-align:center}
#login img{width:88px;height:88px;border-radius:22px;box-shadow:0 12px 30px rgba(232,89,12,.3)}
#login h1{margin:16px 0 4px;font-size:30px;letter-spacing:-.02em}#login p{color:var(--mute);margin:0 0 24px}
.empty{padding:20px;text-align:center;color:var(--mute)}
.foot{text-align:center;color:var(--mute);font-size:12px;margin-top:28px}
.hint{font-size:12px;color:var(--mute);margin:8px 6px 0}
</style>
</head>
<body>
<div id="loadbar"><i></i></div>

<section id="login" class="hidden">
  <img src="flousna-icon-512.png" alt="">
  <h1>Flousna</h1>
  <p>Our money, in one place</p>
  <div id="stepEmail">
    <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="Your email" autocapitalize="off">
    <button class="btn" id="sendBtn">Send me a code</button>
  </div>
  <div id="stepCode" class="hidden">
    <p class="mute" id="codeNote" style="margin-bottom:12px"></p>
    <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6 digit code" maxlength="6" style="text-align:center;letter-spacing:.3em">
    <button class="btn" id="verifyBtn">Sign in</button>
    <button class="link" id="backBtn">Use another email</button>
  </div>
  <div class="msg" id="loginMsg"></div>
</section>

<section id="app" class="hidden">
  <header>
    <div class="hello"><div class="t" id="updated">Loading…</div><h1 id="title">Flousna</h1></div>
    <div class="hbtns">
      <button class="round" id="refreshBtn" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.2M3 12A9 9 0 0 1 18.5 5.8"/><path d="M18.5 2v3.8h-3.8M5.5 22v-3.8h3.8"/></svg></button>
      <button class="round avatar" id="meBtn" aria-label="Account">·</button>
    </div>
  </header>
  <main id="view"></main>
  <div class="foot" id="foot"></div>
</section>

<nav id="nav" class="hidden">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-tab="budget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Budget</button>
  <button data-tab="spend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M7 15h3"/></svg>Spending</button>
</nav>

<script>
(function () {
  var API = window.FLOUSNA_API;
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  var state = {data: null, tab: store.get('fl-tab') || 'home', cat: null, email: null, view: {}};

  function call(body) {
    return fetch(API, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(body), redirect: 'follow'})
      .then(function (r) { return r.json(); });
  }
  var esc = function (x) { return String(x == null ? '' : x).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); };
  var fmt = function (n, dp) { n = +n || 0; return (n < 0 ? '−' : '') + Math.abs(n).toLocaleString('en-US', {minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0}); };
  var sgn = function (n, dp) { return (n > 0 ? '+' : '') + fmt(n, dp); };
  var money = function (n, cur, dp) { return '<span class="num">' + fmt(n, dp) + '</span><span class="cur">' + (cur || 'AED') + '</span>'; };
  var d = function (x) { return x ? new Date(x) : null; };
  var day = function (x) { x = d(x); return x ? x.toLocaleDateString('en-GB', {day: 'numeric', month: 'short'}) : ''; };
  var monthName = function (x) { x = d(x); return x ? x.toLocaleDateString('en-GB', {month: 'long', year: 'numeric'}) : ''; };
  var chip = function (s) {
    if (!s) return '';
    var k = /over|not yet/i.test(s) ? (/over/i.test(s) ? 'down' : 'warnc') : /watch|behind/i.test(s) ? 'warnc' : /on track|paid|met|done/i.test(s) ? 'up' : 'n';
    return '<span class="chip ' + k + '">' + esc(s) + '</span>';
  };
  var fillFor = function (s) { return /over/i.test(s) ? 'f-bad' : /watch/i.test(s) ? 'f-warn' : /no target/i.test(s) ? 'f-mute' : 'f-good'; };
  var PAL = ['#e8590c', '#4263eb', '#12b886', '#d6336c', '#7950f2', '#15aabf', '#f59f00', '#82c91e', '#be4bdb', '#1c7ed6', '#fa5252', '#868e96', '#20c997', '#fd7e14', '#5c7cfa', '#a9e34b'];
  var I = {
    cash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9.5v.01M18 14.5v.01"/></svg>',
    gold: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 18h16l-2.5-6h-11zM7.5 12 9 8h6l1.5 4"/></svg>',
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9.5 21v-6h5v6"/></svg>',
    card: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M7 15h3"/></svg>',
    bank: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 4l9 5.5M4.5 10v8M9.5 10v8M14.5 10v8M19.5 10v8M3 20.5h18"/></svg>',
    safe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3.5" width="18" height="16" rx="2.5"/><circle cx="12" cy="11.5" r="3.5"/><path d="M12 8v1M6 21v-1.5M18 21v-1.5"/></svg>',
    alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16.5v.01"/></svg>',

  // ------------------------------------------------------------ sign in
  function showLogin(msg) {

  }
  $('sendBtn').onclick = function () {

    $('sendBtn').disabled = true; $('loginMsg').textContent = '';

      $('sendBtn').disabled = false;

      store.set('fl-email', em); state.email = em;

      $('code').focus();
    }).catch(function () { $('sendBtn').disabled = false; $('loginMsg').textContent = 'No connection. Try again.'; });
  };
  $('verifyBtn').onclick = function () {
    $('verifyBtn').disabled = true; $('loginMsg').textContent = '';
    call({flousna: 'verify', email: state.email || $('email').value.trim().toLowerCase(), code: $('code').value}).then(function (r) {
      $('verifyBtn').disabled = false;
      if (!r.ok) { $('loginMsg').textContent = r.error || 'That did not work.'; return; }
      store.set('fl-session', r.session); $('code').value = ''; load();
    }).catch(function () { $('verifyBtn').disabled = false; $('loginMsg').textContent = 'No connection. Try again.'; });
  };
  $('code').addEventListener('input', function () { if ($('code').value.replace(/\D/g, '').length === 6) $('verifyBtn').click(); });
  $('backBtn').onclick = function () { $('stepCode').classList.add('hidden'); $('stepEmail').classList.remove('hidden'); $('loginMsg').textContent = ''; };

  // ------------------------------------------------------------ edit sheets
  function toast(t) { var el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(function () { el.remove(); }, 2600); }
  function closeSheet() { var b = document.querySelector('.sheetbg'); if (b) b.remove(); }
  function openSheet(title, sub, fields, btn, send) {
    closeSheet();
    var bg = document.createElement('div'); bg.className = 'sheetbg';
    bg.innerHTML = '<div class="sheet"><div class="grab"></div><h3>' + esc(title) + '</h3><div class="sub">' + sub + '</div>' + fields +
      (btn ? '<button class="btn" id="sheetOk">' + esc(btn) + '</button>' : '') + '<button class="btn ghost" id="sheetNo">' + (btn ? 'Cancel' : 'Close') + '</button><div class="msg" id="sheetMsg"></div></div>';
    document.body.appendChild(bg);
    bg.onclick = function (e) { if (e.target === bg) closeSheet(); };
    $('sheetNo').onclick = closeSheet;
    if (!btn) return bg;
    $('sheetOk').onclick = function () {
      var body;
      try { body = send(); } catch (err) { $('sheetMsg').textContent = err.message; return; }
      body.session = store.get('fl-session');
      $('sheetOk').disabled = true; $('sheetMsg').textContent = ''; busy(true);
      call(body).then(function (r) {
        busy(false); $('sheetOk').disabled = false;
        if (r.auth === false) { closeSheet(); store.del('fl-session'); showLogin('Please sign in again.'); return; }
        if (!r.ok) { $('sheetMsg').textContent = r.error || 'Could not save.'; return; }
        closeSheet(); state.data = r.data; render(); toast(r.message || 'Saved');
      }).catch(function () { busy(false); $('sheetOk').disabled = false; $('sheetMsg').textContent = 'No connection. Try again.'; });
    };
    var first = bg.querySelector('input,select'); if (first && first.type !== 'date') setTimeout(function () { first.focus(); }, 250);
    return bg;
  }
  function catSelect(id, selected) {
    var list = (state.data.categoryList || []), h = ['<select id="' + id + '">'];
    if (!selected) h.push('<option value="">Pick a category</option>');

    list.forEach(function (c) { (groups[c.line] = groups[c.line] || []).push(c.name); });
    Object.keys(groups).forEach(function (g) {
      h.push('<optgroup label="' + esc(g) + '">');
      groups[g].forEach(function (n) { h.push('<option' + (n === selected ? ' selected' : '') + '>' + esc(n) + '</option>'); });
      h.push('</optgroup>');
    });

  }
  var todayIso = function () { var t = new Date(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); };
  var needAmount = function (id) { var v = parseFloat(String($(id).value).replace(/,/g, '')); if (!(v > 0)) throw new Error('Type the amount'); return v; };

  function editCategory(r) {

      '<label>Date</label><input id="fDate" type="date" value="' + todayIso() + '">', 'Mark paid', function () {

  // ------------------------------------------------------------ data
  function load() {

    $('login').classList.add('hidden'); $('app').classList.remove('hidden'); $('nav').classList.remove('hidden');
    busy(true);
    call({flousna: 'data', session: s}).then(function (r) {
      busy(false);
      if (r.auth === false) { store.del('fl-session'); showLogin('Please sign in again.'); return; }
      if (!r.ok) { $('updated').textContent = r.error || 'Could not load'; return; }
      state.data = r.data; state.email = r.email; render();
    }).catch(function () { busy(false); $('updated').textContent = 'Offline · tap refresh to retry'; });
  }
  $('refreshBtn').onclick = load;
  document.addEventListener('visibilitychange', function () { if (!document.hidden && state.data && Date.now() - state.loadedAt > 60000) load(); });
  Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) {
    b.onclick = function () { state.tab = b.dataset.tab; store.set('fl-tab', state.tab); render(); window.scrollTo(0, 0); };
  });

  function render() {
    state.loadedAt = Date.now();
    state.view = {sp: [], ac: []};
    var D = state.data;
    var hr = new Date().getHours();
    var titles = {home: hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening', budget: 'Budget', spend: 'Spending'};
    $('title').textContent = titles[state.tab];
    $('updated').textContent = 'Updated ' + new Date(D.holdings.now).toLocaleString('en-GB', {weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit'});
    $('meBtn').textContent = (state.email || '?').charAt(0).toUpperCase();
    Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) { b.classList.toggle('on', b.dataset.tab === state.tab); });
    $('view').innerHTML = state.tab === 'budget' ? budgetView(D) : state.tab === 'spend' ? spendView(D) : homeView(D);
    var fab = document.querySelector('.fab'); if (fab) fab.remove();
    if (state.tab === 'spend') { fab = document.createElement('button'); fab.className = 'fab'; fab.innerHTML = I.plus; fab.setAttribute('aria-label', 'Add cash expense'); fab.onclick = addCash; document.body.appendChild(fab); }
    var on = function (sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), function (el) { el.onclick = function () { fn(el); }; }); };
    on('[data-sp]', function (el) { editCategory(state.view.sp[+el.dataset.sp]); });
    on('[data-fx]', function (el) { markPaid(state.data.budget.fixed[+el.dataset.fx]); });
    on('[data-ac]', function (el) { setBalance(state.view.ac[+el.dataset.ac]); });
    on('[data-cat]', function (el) { state.cat = el.dataset.cat || null; render(); });
    on('[data-go]', function (el) { state.tab = el.dataset.go; store.set('fl-tab', state.tab); render(); window.scrollTo(0, 0); });
  }

  // ------------------------------------------------------------ home
  function homeView(D) {
    var H = D.holdings, h = [], today = new Date();
    var cash = {}, cashAed = 0, owed = 0, dueNow = 0;
    H.accts.forEach(function (a) { cash[a.cur] = (cash[a.cur] || 0) + a.bal; cashAed += a.aed; });
    H.cards.forEach(function (c) { owed += c.owed; dueNow += c.stillDue; });
    var G = H.gold, M = H.mort, usd = (H.fx && H.fx.USD) || 3.6725, OZ = 31.1034768;
    var mortAed = M && M.leftAed != null ? M.leftAed : 0, homeAed = M ? (M.homeAed || 0) : 0;
    var assets = cashAed + G.value + homeAed, debts = owed + mortAed, worth = assets - debts;
    var gpl = G.value - G.cost, gpct = G.cost ? gpl / G.cost : 0;

    // hero
    h.push('<div class="hero"><div class="lbl">Net worth</div>',
      '<div class="big num ' + (worth >= 0 ? '' : 'down') + '">' + fmt(worth) + '<span class="cur">AED</span></div>',
      '<div class="split"><span style="flex:' + assets + ';background:#5fe0a6"></span><span style="flex:' + Math.max(debts, assets * .004) + ';background:#ff8a80"></span></div>',
      '<div class="legend2"><div><div class="k"><span class="dot" style="background:#5fe0a6"></span>What we own</div><div class="v num up">' + fmt(assets) + '</div></div>',
      '<div><div class="k"><span class="dot" style="background:#ff8a80"></span>What we owe</div><div class="v num down">−' + fmt(debts) + '</div></div></div></div>');

    // due alerts
    H.cards.filter(function (c) { return c.stillDue > 0; }).forEach(function (c) {
      var due = d(c.due), days = due ? Math.ceil((due - today) / 864e5) : null;
      h.push('<div class="alert ' + (days != null && days <= 5 ? 'badc' : '') + '">' + I.alert + '<div>' + fmt(c.stillDue, 2) + ' AED due on ' + esc(c.id) +
        (due ? ' by ' + esc(day(c.due)) + (days != null ? ' · ' + (days <= 0 ? 'today' : days + ' days left') : '') : '') + '</div></div>');
    });

    // assets & debts
    h.push('<h2>What we own</h2><div class="rows">',
      row('g', I.cash, 'Cash in accounts', H.accts.length + ' accounts · ' + Object.keys(cash).join(', '), '<span class="up">' + money(cashAed) + '</span>'),
      row('o', I.gold, 'Gold', fmt(G.grams, 1) + ' g · 24K', '<span class="' + (gpl >= 0 ? 'up' : 'down') + '">' + money(G.value) + '</span><div class="s ' + (gpl >= 0 ? 'up' : 'down') + '">' + sgn(gpl) + ' (' + (gpct >= 0 ? '+' : '') + (gpct * 100).toFixed(1) + '%)</div>'),
      homeAed ? row('g', I.home, 'Home', 'Property value', '<span class="up">' + money(homeAed) + '</span>') : '', '</div>');
    h.push('<h2>What we owe</h2><div class="rows">',
      row('r', I.card, 'Credit cards', H.cards.length + ' cards' + (dueNow > 0 ? ' · ' + fmt(dueNow) + ' due now' : ' · nothing due now'), '<span class="down">−' + money(owed) + '</span>'),
      M ? row('r', I.home, 'Mortgage', esc(M.bank || '') + (M.paidPct != null ? ' · ' + Math.round(M.paidPct * 100) + '% paid off' : ''), '<span class="down">−' + money(mortAed) + '</span>') : '', '</div>');

    // cash by currency
    var curs = Object.keys(cash).sort(function (a, b) { var o = ['AED', 'USD', 'EGP']; return (o.indexOf(a) + 9) % 12 - (o.indexOf(b) + 9) % 12; });
    var cc = {AED: '#e8590c', USD: '#12b886', EGP: '#4263eb'};
    h.push('<h2>Cash by currency</h2><div class="card"><div class="stack">');
    curs.forEach(function (c, i) { var aed = c === 'AED' ? cash[c] : cash[c] * (H.fx[c] || 0); h.push('<span style="flex:' + Math.max(aed, 0) + ';background:' + (cc[c] || PAL[i + 3]) + '"></span>'); });
    h.push('</div>');
    curs.forEach(function (c, i) {
      var aed = c === 'AED' ? cash[c] : cash[c] * (H.fx[c] || 0);
      h.push('<div class="row" style="padding:5px 0"><span><span class="dot" style="background:' + (cc[c] || PAL[i + 3]) + ';margin-right:8px"></span><b>' + esc(c) + '</b> <span class="mute small">' + Math.round(cashAed ? aed / cashAed * 100 : 0) + '%</span></span>',
        '<span style="text-align:right"><span class="num" style="font-weight:650">' + fmt(cash[c]) + '</span>' + (c !== 'AED' ? '<div class="mute small num">≈ ' + fmt(aed) + ' AED</div>' : '') + '</span></div>');
    });
    h.push('</div>');

    // gold
    if (G.grams) {
      var be = G.grams ? G.cost / G.grams * OZ : 0, nowOz = G.price * OZ;
      h.push('<h2>Gold <small>' + (G.updated ? 'price ' + esc(new Date(G.updated).toLocaleTimeString('en-GB', {hour: 'numeric', minute: '2-digit'})) : '') + '</small></h2><div class="card">',
        '<div class="row"><div><div class="kv1">Value today</div><div class="v1 num ' + (gpl >= 0 ? 'up' : 'down') + '">' + fmt(G.value) + '<span class="cur">AED</span></div></div>',
        '<span class="chip ' + (gpl >= 0 ? 'up' : 'down') + '">' + (gpl >= 0 ? '▲ ' : '▼ ') + (gpct * 100).toFixed(1) + '%</span></div>',
        '<div class="stats"><div>Paid<b>' + fmt(G.cost) + ' AED</b></div><div>Profit / loss<b class="' + (gpl >= 0 ? 'up' : 'down') + '">' + sgn(gpl) + ' AED</b></div>',
        '<div>Weight<b>' + fmt(G.grams, 1) + ' g' + (G.bars ? ' · ' + G.bars + ' bars' : '') + '</b></div><div>Price per gram<b>' + fmt(G.price, 2) + ' AED</b></div>',
        '<div>Today per oz<b class="' + (nowOz >= be ? 'up' : 'down') + '">$' + fmt(nowOz / usd) + '</b></div><div>Break-even per oz<b>$' + fmt(be / usd) + '</b></div></div></div>');
    }

    // mortgage
    if (M) {
      var paid = Math.max(0, Math.min(1, M.paidPct || 0));
      h.push('<h2>Mortgage <small>' + esc(M.bank || '') + '</small></h2><div class="card">',
        '<div class="row"><div><div class="kv1">Still to pay</div><div class="v1 num down">−' + fmt(M.left || 0) + '<span class="cur">' + esc(M.cur || 'AED') + '</span></div></div>',
        '<span class="chip up">' + Math.round(paid * 100) + '% paid</span></div>',
        '<div class="bar"><i class="f-good" style="width:' + (paid * 100).toFixed(1) + '%"></i></div>',
        '<div class="row mute small"><span>Loan ' + fmt(M.loan) + '</span><span>' + (M.monthsLeft != null ? fmt(M.monthsLeft) + ' instalments left' : '') + '</span></div>',
        '<div class="stats"><div>Monthly instalment<b>' + (M.instalment != null ? fmt(M.instalment, 2) : '-') + '</b></div>',
        '<div>Last instalment<b>' + (M.end ? esc(new Date(M.end).toLocaleDateString('en-GB', {month: 'short', year: 'numeric'})) : '-') + '</b></div>',
        '<div>Interest still to pay<b class="down">' + (M.interestLeft != null ? '−' + fmt(M.interestLeft) : '-') + '</b></div>',
        '<div>Home equity<b class="up">' + (M.equity != null ? fmt(M.equity) + ' AED' : '-') + '</b></div></div></div>');
    }

    // credit cards
    h.push('<h2>Credit cards</h2>');
    H.cards.forEach(function (c) {
      var used = c.limit ? Math.min(1, Math.max(0, c.owed / c.limit)) : 0;
      var prog = c.target ? Math.min(1, c.spent / c.target) : 0, met = c.target && c.spent >= c.target;
      var fx = c.cur && c.cur !== 'AED' && H.fx[c.cur];
      h.push('<div class="cc"><div class="top"><div><div class="nm">' + esc(c.id) + '</div><div class="bk">' + esc(c.bank) + '</div></div>',
        '<div><div class="owed num ' + (c.owed > 0 ? 'down' : '') + '">' + (c.owed > 0 ? '−' : '') + fmt(c.owed) + '</div><div class="mute small" style="text-align:right">' +
        (fx ? fmt(c.owed / fx) + ' ' + esc(c.cur) + ' of ' + fmt(c.limit / fx) : 'of ' + fmt(c.limit) + ' limit') + '</div></div></div>',
        '<div class="bar"><i class="' + (used > .7 ? 'f-bad' : 'f-acc') + '" style="width:' + (used * 100).toFixed(1) + '%"></i></div>',
        '<div class="row mute small"><span class="up">' + fmt(c.avail) + ' available</span><span>' + (c.stillDue > 0 ? '<span class="down">' + fmt(c.stillDue, 2) + ' due ' + esc(day(c.due)) + '</span>' : 'Nothing due') + '</span></div>');
      if (c.target) {
        h.push('<div class="row" style="margin-top:14px"><span class="small mute">Gym spend target · ' + fmt(c.spent) + ' / ' + fmt(c.target) + '</span>' + chip(c.status) + '</div>',
          '<div class="bar"><i class="' + (met ? 'f-good' : 'f-warn') + '" style="width:' + (prog * 100).toFixed(1) + '%"></i></div>',
          '<div class="row mute small"><span>' + (c.cycleEnd ? 'Cycle ends ' + esc(day(c.cycleEnd)) : '') + '</span><span>' + (met ? 'Done' : fmt(c.target - c.spent) + ' to go' + (c.perDay ? ' · ' + fmt(c.perDay) + '/day' : '')) + '</span></div>');
      }
      h.push('</div>');
    });

    // accounts
    h.push('<h2>Bank accounts <small>tap to update</small></h2><div class="rows">');
    if (!H.accts.length) h.push('<div class="empty">No accounts yet.</div>');
    H.accts.slice().sort(function (x, y) { var o = ['AED', 'USD', 'EGP']; return o.indexOf(x.cur) - o.indexOf(y.cur) || y.aed - x.aed; }).forEach(function (a) {
      state.view.ac.push(a);
      var isCash = !/\d/.test(a.last4);
      h.push('<div class="ri tap" data-ac="' + (state.view.ac.length - 1) + '"><div class="ic ' + (isCash ? 'o' : 'n') + '">' + (isCash ? I.safe : I.bank) + '</div>',
        '<div class="m"><div class="t">' + esc(a.name) + '</div><div class="s">' + esc(a.bank) + (!isCash ? ' ··' + esc(String(a.last4).slice(-4)) : '') + (a.asOf ? ' · ' + esc(day(a.asOf)) : '') + '</div></div>',
        '<div class="a"><span class="num ' + (a.bal < 0 ? 'down' : '') + '">' + fmt(a.bal) + '</span><span class="cur">' + esc(a.cur) + '</span>' + (a.cur !== 'AED' ? '<div class="s num">≈ ' + fmt(a.aed) + ' AED</div>' : '') + '</div></div>');
    });
    h.push('</div>');
    return h.join('');
  }
  function row(tone, icon, t, s, a) {

  }

  // ------------------------------------------------------------ budget
  function ringSvg(frac, pace, color, size, stroke) {
    var r = (size - stroke) / 2, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac));
    var px = size / 2 + r * Math.cos(2 * Math.PI * pace), py = size / 2 + r * Math.sin(2 * Math.PI * pace);
    return '<svg viewBox="0 0 ' + size + ' ' + size + '"><circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="var(--track)" stroke-width="' + stroke + '"/>' +
      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + (c * f).toFixed(1) + ' ' + c.toFixed(1) + '"/>' +
      (pace != null ? '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="' + (stroke / 2 + 1.5) + '" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>' : '') + '</svg>';
  }
  function budgetView(D) {
    var B = D.budget, h = [];
    if (!B) return '<div class="empty">No Budget tab yet.</div>';
    var T = B.total, frac = T.target ? T.spent / T.target : 0;
    var col = /over/i.test(T.status) ? 'var(--bad)' : /watch/i.test(T.status) ? 'var(--warn)' : 'var(--good)';
    var over = B.lines.filter(function (l) { return /over/i.test(l.status); }).length;
    var ok = B.lines.filter(function (l) { return /on track/i.test(l.status) && (l.target || l.spent); }).length;
    h.push('<div class="card"><div class="ringwrap"><div class="ring">' + ringSvg(frac, B.pace, col, 132, 12) +
      '<div class="c"><b class="num">' + Math.round(frac * 100) + '%</b><span>of budget</span></div></div>',
      '<div class="ringinfo"><div class="kv1">' + esc(monthName(B.month)) + '</div><div class="v1 num">' + fmt(T.spent) + '<span class="cur">AED</span></div>',
      '<div class="mute small">of ' + fmt(T.target) + ' · ' + (T.left >= 0 ? '<span class="up">' + fmt(T.left) + ' left</span>' : '<span class="down">' + fmt(-T.left) + ' over</span>') + '</div>',
      '<div class="sumchips">' + (over ? '<span class="chip down">' + over + ' over</span>' : '') + '<span class="chip up">' + ok + ' on track</span></div>',
      '<div class="mute small" style="margin-top:8px">● marks today: ' + Math.round(B.pace * 100) + '% of the month</div></div></div></div>');

    h.push('<h2>Budget lines</h2><div class="rows" style="padding:0">');
    B.lines.filter(function (l) { return l.target || l.spent; }).sort(function (a, b) {
      var w = function (s) { return /over/i.test(s) ? 0 : /watch/i.test(s) ? 1 : /no target/i.test(s) ? 3 : 2; };
      return w(a.status) - w(b.status) || b.target - a.target;
    }).forEach(function (l) {
      var q = /quarter/i.test(l.type), tgt = q ? l.target * 3 : l.target, used = q ? tgt - l.left : l.spent;
      var w = tgt ? Math.min(100, used / tgt * 100) : (used ? 100 : 0);
      h.push('<div class="line"><div class="row"><span class="n">' + esc(l.name) + (q ? ' <span class="chip n">3 months</span>' : '') + '</span>' + chip(l.status) + '</div>',
        '<div class="bar"><i class="' + fillFor(l.status) + '" style="width:' + w.toFixed(1) + '%"></i>' + (/variable/i.test(l.type) && tgt ? '<b style="left:' + (B.pace * 100).toFixed(1) + '%"></b>' : '') + '</div>',
        '<div class="r"><span class="num">' + fmt(q ? used : l.spent) + (tgt ? ' / ' + fmt(tgt) : ' spent') + '</span><span class="num">' + (!tgt ? 'no target set' : l.left >= 0 ? '<span class="up">' + fmt(l.left) + ' left</span>' : '<span class="down">' + fmt(-l.left) + ' over</span>') + '</span></div></div>');
    });
    h.push('</div>');

    var fixed = B.fixed.map(function (f, i) { f.i = i; return f; }).filter(function (f) { return f.budget || f.paid; });
    var paidN = fixed.filter(function (f) { return /paid/i.test(f.status); }).length;
    h.push('<h2>Fixed payments <small>' + paidN + ' of ' + fixed.length + ' paid</small></h2><div class="rows">');
    fixed.sort(function (a, b) { return (/paid/i.test(a.status) ? 1 : 0) - (/paid/i.test(b.status) ? 1 : 0) || b.budget - a.budget; }).forEach(function (f) {
      var isPaid = /paid/i.test(f.status), can = !/auto/i.test(f.how);
      h.push('<div class="ri' + (can ? ' tap" data-fx="' + f.i : '') + '"><div class="check ' + (isPaid ? 'on' : '') + '">' + (isPaid ? I.check : '') + '</div>',
        '<div class="m"><div class="t">' + esc(f.name) + '</div><div class="s">' + esc(f.paidBy) + ' · ' + esc(/auto/i.test(f.how) ? 'counted on the 1st' : f.how) + '</div></div>',
        '<div class="a"><span class="num">' + fmt(isPaid ? f.paid : f.budget) + '</span>' + (isPaid ? '' : '<div class="s warnc">Not yet</div>') + '</div></div>');
    });
    h.push('</div><div class="hint">Tap one the bank never told us about to mark it paid.</div>');
    return h.join('');
  }

  // ------------------------------------------------------------ spending
  function donutSvg(parts, size, stroke) {
    var r = (size - stroke) / 2, c = 2 * Math.PI * r, tot = parts.reduce(function (s, p) { return s + p.v; }, 0), off = 0, gap = parts.length > 1 ? 2.5 : 0, o = [];
    o.push('<svg viewBox="0 0 ' + size + ' ' + size + '"><circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="var(--track)" stroke-width="' + stroke + '"/>');
    parts.forEach(function (p) {
      var len = tot ? p.v / tot * c : 0;
      if (len > gap) o.push('<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + p.c + '" stroke-width="' + stroke + '" stroke-dasharray="' + (len - gap).toFixed(2) + ' ' + c.toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '"/>');
      off += len;
    });
    return o.join('') + '</svg>';
  }
  function spendView(D) {
    var h = [], cats = (D.categories || []).filter(function (c) { return c.spent > 0; }), rows = D.spending || [];
    var total = cats.reduce(function (s, c) { return s + c.spent; }, 0), colors = {};
    cats.forEach(function (c, i) { colors[c.name] = PAL[i % PAL.length]; });
    var parts = cats.map(function (c) { return {v: c.spent, c: colors[c.name]}; });
    var sel = state.cat && cats.filter(function (c) { return c.name === state.cat; })[0];
    h.push('<div class="card"><div class="kv1" style="margin-bottom:10px">' + esc(monthName(D.budget && D.budget.month)) + '</div><div class="donutwrap"><div class="donut">' + donutSvg(parts, 150, 18) +
      '<div class="c"><b class="num">' + fmt(sel ? sel.spent : total) + '</b><span>' + esc(sel ? sel.name : 'spent') + '</span></div></div><div class="leg">');
    cats.slice(0, 7).forEach(function (c) {
      h.push('<div data-cat="' + esc(c.name) + '"><span class="dot" style="background:' + colors[c.name] + '"></span><span class="nm">' + esc(c.name) + '</span><span class="pc">' + Math.round(c.spent / total * 100) + '%</span></div>');
    });
    if (cats.length > 7) h.push('<div class="mute small" style="cursor:default">+' + (cats.length - 7) + ' more below</div>');
    h.push('</div></div></div>');

    h.push('<div class="chips"><button class="fchip' + (state.cat ? '' : ' on') + '" data-cat="">All</button>');
    cats.forEach(function (c) { h.push('<button class="fchip' + (state.cat === c.name ? ' on' : '') + '" data-cat="' + esc(c.name) + '">' + esc(c.name) + ' · ' + fmt(c.spent) + '</button>'); });
    h.push('</div>');

    var list = rows.filter(function (r) { return !state.cat || r.cat === state.cat; });
    if (!list.length) h.push('<div class="card empty">Nothing here this month.</div>');
    var groups = [], key = null;
    list.forEach(function (r) {
      var k = d(r.date).toDateString();
      if (k !== key) { groups.push({date: r.date, items: []}); key = k; }
      groups[groups.length - 1].items.push(r);
    });
    var todayK = new Date().toDateString(), yK = new Date(Date.now() - 864e5).toDateString();
    groups.forEach(function (g) {
      var k = d(g.date).toDateString(), sum = g.items.reduce(function (s, r) { return s + r.aed; }, 0);
      var label = k === todayK ? 'Today' : k === yK ? 'Yesterday' : d(g.date).toLocaleDateString('en-GB', {weekday: 'long', day: 'numeric', month: 'short'});
      h.push('<div class="dayh"><span>' + label + '</span><span class="num">' + fmt(sum, 2) + '</span></div><div class="rows">');
      g.items.forEach(function (r) {
        var can = r.paidWith !== 'Cash (auto)';
        if (can) state.view.sp.push(r);
        var col = colors[r.cat] || '#868e96';
        h.push('<div class="ri' + (can ? ' tap" data-sp="' + (state.view.sp.length - 1) : '') + '"><div class="ic" style="background:' + col + '1f;color:' + col + '"><span style="font-weight:750;font-size:14px">' + esc((r.cat || '?').charAt(0)) + '</span></div>',
          '<div class="m"><div class="t">' + esc(r.desc) + '</div><div class="s">' + esc(r.cat) + ' · ' + esc(r.paidWith) + (r.who && r.who !== 'MO' && r.who !== 'Family' ? ' · ' + esc(r.who) : '') + '</div></div>',
          '<div class="a num ' + (r.aed < 0 ? 'up' : '') + '">' + (r.aed < 0 ? '+' + fmt(-r.aed, 2) : fmt(r.aed, 2)) + '</div></div>');
      });
      h.push('</div>');
    });
    h.push('<div class="hint">Tap a payment to change its category. Tap + to add a cash expense.</div>');
    return h.join('');
  }

  if (!API) { showLogin('Setup needed: the API address is missing in config.js.'); return; }
  load();
})();
</script>
